<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delfín 3D Realista AR</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    
    <!-- Carga de assets 3D -->
    <a-assets>
      <a-asset-item id="delfin-model" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Dolphin/glTF-Binary/Dolphin.glb"></a-asset-item>
    </a-assets>

    <!-- Marcador Hiro -->
    <a-marker preset="hiro" id="marker-hiro">
      
      <!-- Modelo 3D del delfín orientado de forma horizontal -->
      <a-entity id="delfin" 
                gltf-model="#delfin-model" 
                position="0 0.2 0" 
                scale="0.012 0.012 0.012" 
                rotation="-90 0 0"
                cursor-listener>
      </a-entity>
      
    </a-marker>

    <a-entity camera>
      <a-cursor raycaster="objects: [cursor-listener]" fuse="false"></a-cursor>
    </a-entity>

  </a-scene>

  <script>
    AFRAME.registerComponent('cursor-listener', {
      init: function () {
        var el = this.el;
        var animando = false;

        el.addEventListener('click', function () {
          if (animando) return;
          animando = true;

          // Animación de salto hacia arriba
          el.setAttribute('animation__jump', {
            property: 'position',
            to: '0 1.2 -0.5',
            dir: 'alternate',
            dur: 600,
            loop: 2,
            easing: 'easeOutQuad'
          });

          // Giro acrobático
          el.setAttribute('animation__spin', {
            property: 'rotation',
            to: '-90 360 0',
            dur: 1200,
            easing: 'easeInOutQuad'
          });

          setTimeout(function () {
            el.removeAttribute('animation__jump');
            el.removeAttribute('animation__spin');
            el.setAttribute('rotation', '-90 0 0');
            el.setAttribute('position', '0 0.2 0');
            animando = false;
          }, 1300);
        });
      }
    });
  </script>

</body>
</html>
