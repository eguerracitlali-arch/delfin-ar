<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiencia WebAR - Robot Interactivo</title>
  <!-- Frameworks A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    /* Estilos del botón flotante para interacción RA + JS */
    #btn-girar {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 12px 24px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      background-color: #ec4899;
      border: none;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      outline: none;
    }
    #btn-girar:active {
      transform: translateX(-50%) scale(0.95);
      background-color: #be185d;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Botón en pantalla para girar y escalar el robot -->
  <button id="btn-girar">🤖 Girar y Agrandar Robot</button>

  <a-scene embedded 
           arjs="sourceType: webcam; debugUIEnabled: false;" 
           vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true;">

    <!-- Iluminación de la escena -->
    <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.6" position="-1 4 2"></a-light>

    <!-- Marcador Hiro -->
    <a-marker preset="hiro" id="marker-hiro">

      <!-- PISO / REFERENCIA VISUAL -->
      <a-cylinder position="0 0 0" radius="1.1" height="0.02" color="#ffffff"></a-cylinder>
      <a-ring position="0 0.02 0" radius-inner="0.85" radius-outer="1.0" color="#f43f5e" rotation="-90 0 0"></a-ring>

      <!-- ROBOT ERGUIDO DE PIE (Con posición, escala y rotación) -->
      <a-entity id="robot" 
                position="0 0.3 0" 
                scale="0.45 0.45 0.45" 
                rotation="0 0 0">

        <!-- Cabeza -->
        <a-box id="cabeza" position="0 1.2 0" width="0.6" height="0.5" depth="0.5" color="#a855f7"></a-box>

        <!-- Ojos -->
        <a-sphere position="-0.15 1.28 0.26" radius="0.08" color="#38bdf8"></a-sphere>
        <a-sphere position="0.15 1.28 0.26" radius="0.08" color="#38bdf8"></a-sphere>

        <!-- Antena -->
        <a-cylinder position="0 1.55 0" radius="0.02" height="0.2" color="#64748b"></a-cylinder>
        <a-sphere position="0 1.68 0" radius="0.07" color="#f43f5e"></a-sphere>

        <!-- Cuello -->
        <a-cylinder position="0 0.9 0" radius="0.1" height="0.1" color="#cbd5e1"></a-cylinder>

        <!-- Torso / Cuerpo -->
        <a-box id="cuerpo" position="0 0.45 0" width="0.8" height="0.8" depth="0.6" color="#ec4899"></a-box>
        
        <!-- Panel del pecho -->
        <a-plane position="0 0.45 0.31" width="0.4" height="0.4" color="#a855f7"></a-plane>
        <a-circle position="0 0.45 0.32" radius="0.1" color="#38bdf8"></a-circle>

        <!-- Brazos -->
        <a-cylinder position="-0.52 0.5 0" radius="0.08" height="0.6" color="#a855f7" rotation="0 0 15"></a-cylinder>
        <a-cylinder position="0.52 0.5 0" radius="0.08" height="0.6" color="#a855f7" rotation="0 0 -15"></a-cylinder>

        <!-- Piernas -->
        <a-cylinder position="-0.2 -0.1 0" radius="0.1" height="0.4" color="#475569"></a-cylinder>
        <a-cylinder position="0.2 -0.1 0" radius="0.1" height="0.4" color="#475569"></a-cylinder>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <!-- INTERACCIÓN JAVASCRIPT + REALIDAD AUMENTADA -->
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var robot = document.querySelector('#robot');
      var cabeza = document.querySelector('#cabeza');
      var cuerpo = document.querySelector('#cuerpo');
      var btnGirar = document.querySelector('#btn-girar');

      var animando = false;

      // Paleta de combinaciones de colores para la interacción de cambio de color
      var paletas = [
        { cabeza: '#ec4899', cuerpo: '#a855f7' }, // Rosa y Lila
        { cabeza: '#10b981', cuerpo: '#3b82f6' }, // Verde y Azul
        { cabeza: '#f59e0b', cuerpo: '#ef4444' }, // Amarillo y Rojo
        { cabeza: '#06b6d4', cuerpo: '#8b5cf6' }, // Turquesa y Morado
        { cabeza: '#f43f5e', cuerpo: '#14b8a6' }, // Fucsia y Esmeralda
        { cabeza: '#a855f7', cuerpo: '#ec4899' }  // Lila y Rosa
      ];
      var indiceColor = 0;

      // 1. INTERACCIÓN 1: Tocar la pantalla para CAMBIAR DE COLOR
      function cambiarColor(e) {
        // Evitar activar el cambio de color si se presiona el botón
        if (e.target === btnGirar) return;
        
        indiceColor = (indiceColor + 1) % paletas.length;
        cabeza.setAttribute('material', 'color', paletas[indiceColor].cabeza);
        cuerpo.setAttribute('material', 'color', paletas[indiceColor].cuerpo);
      }

      window.addEventListener('click', cambiarColor);

      // 2. INTERACCIÓN 2: Presionar el BOTÓN para GIRAR y AUMENTAR DE TAMAÑO
      btnGirar.addEventListener('click', function (e) {
        e.stopPropagation(); // Prevenir conflicto con el evento de toque
        if (animando) return;
        animando = true;

        // A) Animación de Aumento de Tamaño (Escala)
        robot.setAttribute('animation__scale', {
          property: 'scale',
          to: '0.65 0.65 0.65',
          dir: 'alternate',
          dur: 400,
          loop: 2,
          easing: 'easeOutQuad'
        });

        // B) Animación de Giro de 360 Grados (Rotación)
        robot.setAttribute('animation__spin', {
          property: 'rotation',
          to: '0 360 0',
          dur: 900,
          easing: 'easeInOutQuad'
        });

        // Restablecer el estado tras finalizar las animaciones
        setTimeout(function () {
          robot.removeAttribute('animation__scale');
          robot.removeAttribute('animation__spin');
          robot.setAttribute('scale', '0.45 0.45 0.45');
          robot.setAttribute('rotation', '0 0 0');
          animando = false;
        }, 1000);
      });
    });
  </script>

</body>
</html>
