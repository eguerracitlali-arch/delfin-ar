<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Experiencia WebAR - Robot Interactivo</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    /* Zona flotante inferior de interacción */
    .btn-container {
      position: absolute;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 999999 !important;
      pointer-events: auto;
      padding: 0 15px;
      box-sizing: border-box;
    }

    .btn-ui {
      background: #ec4899;
      color: #ffffff;
      border: 3px solid #ffffff;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
      outline: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      flex: 1;
      max-width: 180px;
    }

    #btn-color {
      background: #a855f7;
    }

    .btn-ui:active {
      transform: scale(0.92);
      opacity: 0.9;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- BOTONES DIRECTOS DE INTERACCIÓN EN PANTALLA -->
  <div class="btn-container">
    <button id="btn-color" class="btn-ui">🎨 CAMBIAR COLOR</button>
    <button id="btn-girar" class="btn-ui">🔄 GIRAR / AGRANDAR</button>
  </div>

  <a-scene embedded 
           arjs="sourceType: webcam; debugUIEnabled: false;" 
           vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true;">

    <!-- Iluminación -->
    <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.6" position="-1 4 2"></a-light>

    <!-- Marcador Hiro -->
    <a-marker preset="hiro" id="marker-hiro">

      <!-- PISO / REFERENCIA VISUAL -->
      <a-cylinder position="0 0 0" radius="1.1" height="0.02" color="#ffffff"></a-cylinder>
      <a-ring position="0 0.02 0" radius-inner="0.85" radius-outer="1.0" color="#f43f5e" rotation="-90 0 0"></a-ring>

      <!-- ROBOT ERGUIDO DE PIE -->
      <a-entity id="robot" 
                position="0 0.3 0" 
                scale="0.45 0.45 0.45" 
                rotation="0 0 0">

        <!-- Cabeza -->
        <a-box id="cabeza" position="0 1.2 0" width="0.6" height="0.5" depth="0.5" color="#a855f7"></a-box>

        <!-- Ojos -->
        <a-sphere position="-0.15 1.28 0.26" radius="0.08" color="#38bdf8"></a-sphere>
        <a-sphere position="0.15 1.28 0.26" radius="0.08" color="#38bdf8"></a-sphere>

        <!-- Antena -->
        <a-cylinder position="0 1.55 0" radius="0.02" height="0.2" color="#64748b"></a-cylinder>
        <a-sphere position="0 1.68 0" radius="0.07" color="#f43f5e"></a-sphere>

        <!-- Cuello -->
        <a-cylinder position="0 0.9 0" radius="0.1" height="0.1" color="#cbd5e1"></a-cylinder>

        <!-- Torso / Cuerpo -->
        <a-box id="cuerpo" position="0 0.45 0" width="0.8" height="0.8" depth="0.6" color="#ec4899"></a-box>
        
        <!-- Panel del pecho -->
        <a-plane position="0 0.45 0.31" width="0.4" height="0.4" color="#a855f7"></a-plane>
        <a-circle position="0 0.45 0.32" radius="0.1" color="#38bdf8"></a-circle>

        <!-- Brazos -->
        <a-cylinder position="-0.52 0.5 0" radius="0.08" height="0.6" color="#a855f7" rotation="0 0 15"></a-cylinder>
        <a-cylinder position="0.52 0.5 0" radius="0.08" height="0.6" color="#a855f7" rotation="0 0 -15"></a-cylinder>

        <!-- Piernas -->
        <a-cylinder position="-0.2 -0.1 0" radius="0.1" height="0.4" color="#475569"></a-cylinder>
        <a-cylinder position="0.2 -0.1 0" radius="0.1" height="0.4" color="#475569"></a-cylinder>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <!-- LÓGICA DE INTERACCIÓN EN JAVASCRIPT -->
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var robot = document.querySelector('#robot');
      var cabeza = document.querySelector('#cabeza');
      var cuerpo = document.querySelector('#cuerpo');
      var btnColor = document.querySelector('#btn-color');
      var btnGirar = document.querySelector('#btn-girar');

      var animando = false;

      // Paletas cromáticas para alternar al presionar
      var paletas = [
        { cabeza: '#10b981', cuerpo: '#3b82f6' }, // Menta y Azul
        { cabeza: '#f59e0b', cuerpo: '#ef4444' }, // Ámbar y Rojo
        { cabeza: '#06b6d4', cuerpo: '#8b5cf6' }, // Turquesa y Morado
        { cabeza: '#f43f5e', cuerpo: '#14b8a6' }, // Fucsia y Esmeralda
        { cabeza: '#a855f7', cuerpo: '#ec4899' }  // Lila y Rosa
      ];
      var indiceColor = 0;

      // 1. CAMBIO DE COLOR (Activado por botón o toque en pantalla)
      function ejecutarCambioColor(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        indiceColor = (indiceColor + 1) % paletas.length;
        cabeza.setAttribute('material', 'color', paletas[indiceColor].cabeza);
        cuerpo.setAttribute('material', 'color', paletas[indiceColor].cuerpo);
      }

      // 2. GIRO Y AGRANDAR DE TAMAÑO
      function ejecutarGiroYAgrandar(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        if (animando) return;
        animando = true;

        robot.setAttribute('animation__scale', {
          property: 'scale',
          to: '0.65 0.65 0.65',
          dir: 'alternate',
          dur: 400,
          loop: 2,
          easing: 'easeOutQuad'
        });

        robot.setAttribute('animation__spin', {
          property: 'rotation',
          to: '0 360 0',
          dur: 900,
          easing: 'easeInOutQuad'
        });

        setTimeout(function () {
          robot.removeAttribute('animation__scale');
          robot.removeAttribute('animation__spin');
          robot.setAttribute('scale', '0.45 0.45 0.45');
          robot.setAttribute('rotation', '0 0 0');
          animando = false;
        }, 1000);
      }

      // Conectar eventos a los botones
      btnColor.addEventListener('click', ejecutarCambioColor);
      btnColor.addEventListener('touchstart', ejecutarCambioColor);

      btnGirar.addEventListener('click', ejecutarGiroYAgrandar);
      btnGirar.addEventListener('touchstart', ejecutarGiroYAgrandar);

      // También permite tocar cualquier parte superior de la pantalla para cambiar el color
      window.addEventListener('touchend', function (e) {
        if (e.target === btnGirar || btnGirar.contains(e.target) || e.target === btnColor || btnColor.contains(e.target)) return;
        ejecutarCambioColor(e);
      });
    });
  </script>

</body>
</html>
