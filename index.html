<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delfín Realista 3D en Realidad Aumentada</title>
  <!-- Librerías de A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- Extras de A-Frame para soportar animaciones del modelo 3D -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Desactivamos la interfaz de VR (vr-mode-ui) para evitar la pantalla dividida Cardboard -->
  <a-scene embedded arjs vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;">
    
    <!-- Cargamos el recurso 3D del delfín -->
    <a-assets>
      <!-- Modelo 3D de un delfín realista y animado (gltf) -->
      <a-asset-item id="modelo-delfin" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Dolphin/glTF/Dolphin.gltf"></a-asset-item>
    </a-assets>

    <!-- Marcador Hiro -->
    <a-marker preset="hiro" id="marker-hiro">
      
      <!-- Insertamos el modelo 3D con animación de nado continua (animation-mixer) -->
      <a-entity id="delfin" 
                gltf-model="#modelo-delfin" 
                position="0 0 0" 
                scale="0.01 0.01 0.01" 
                rotation="0 180 0"
                animation-mixer="clip: *; loop: repeat; timeScale: 1"
                cursor-listener>
      </a-entity>
      
    </a-marker>

    <!-- Cámara para detección e interacción táctil -->
    <a-entity camera>
      <a-cursor raycaster="objects: [cursor-listener]" fuse="false"></a-cursor>
    </a-entity>

  </a-scene>

  <!-- Script para interactividad (salto al tocarlo en pantalla) -->
  <script>
    AFRAME.registerComponent('cursor-listener', {
      init: function () {
        var el = this.el;
        var animando = false;

        el.addEventListener('click', function () {
          if (animando) return;
          animando = true;

          // Efecto de salto/impulso hacia arriba y adelante
          el.setAttribute('animation__jump', {
            property: 'position',
            to: '0 1.5 -1',
            dir: 'alternate',
            dur: 600,
            loop: 2,
            easing: 'easeOutQuad'
          });

          // Un pequeño giro o pirueta mientras salta
          el.setAttribute('animation__spin', {
            property: 'rotation',
            to: '0 540 0',
            dur: 1200,
            easing: 'easeInOutQuad'
          });

          setTimeout(function () {
            el.removeAttribute('animation__jump');
            el.removeAttribute('animation__spin');
            el.setAttribute('rotation', '0 180 0');
            el.setAttribute('position', '0 0 0');
            animando = false;
          }, 1300);
        });
      }
    });
  </script>

</body>
</html>
