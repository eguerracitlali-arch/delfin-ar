<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delfín 3D en Realidad Aumentada</title>
  <!-- Librerías de A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Desactivamos la interfaz de VR (vr-mode-ui) para evitar la pantalla dividida Cardboard -->
  <a-scene embedded arjs vr-mode-ui="enabled: false">
    
    <!-- Marcador Hiro -->
    <a-marker preset="hiro" id="marker-hiro">
      
      <!-- Contenedor del Delfín con interacción -->
      <a-entity id="delfin" position="0 0 0" scale="0.8 0.8 0.8" cursor-listener>
        
        <!-- Cuerpo principal -->
        <a-cone position="0 0.6 0" radius-bottom="0.4" radius-top="0.05" height="1.6" color="#0088cc" rotation="90 0 0"></a-cone>
        
        <!-- Cabeza y hocico -->
        <a-sphere position="0 0.6 -0.8" radius="0.3" color="#00aaee"></a-sphere>
        <a-cone position="0 0.5 -1.1" radius-bottom="0.12" radius-top="0.02" height="0.5" color="#00aaee" rotation="90 0 0"></a-cone>
        
        <!-- Ojos -->
        <a-sphere position="0.15 0.7 -0.8" radius="0.04" color="#000000"></a-sphere>
        <a-sphere position="-0.15 0.7 -0.8" radius="0.04" color="#000000"></a-sphere>
        
        <!-- Aleta dorsal -->
        <a-triangle vertex-a="0 0 0" vertex-b="0 0.5 -0.3" vertex-c="0 0 0.4" color="#0066aa" position="0 0.8 0.1"></a-triangle>
        
        <!-- Aletas laterales -->
        <a-triangle vertex-a="0 0 0" vertex-b="0.6 -0.2 0.2" vertex-c="0.2 0 -0.3" color="#0066aa" position="0.2 0.5 -0.2"></a-triangle>
        <a-triangle vertex-a="0 0 0" vertex-b="-0.6 -0.2 0.2" vertex-c="-0.2 0 -0.3" color="#0066aa" position="-0.2 0.5 -0.2"></a-triangle>
        
        <!-- Cola y aleta caudal -->
        <a-cone position="0 0.6 1.1" radius-bottom="0.2" radius-top="0.05" height="0.8" color="#0088cc" rotation="90 0 0"></a-cone>
        <a-triangle vertex-a="0 0 0" vertex-b="0.5 0 0.4" vertex-c="-0.5 0 0.4" color="#0066aa" position="0 0.6 1.5"></a-triangle>
        
        <!-- Vientre -->
        <a-cone position="0 0.45 0" radius-bottom="0.38" radius-top="0.04" height="1.5" color="#e0f7fa" rotation="90 0 0"></a-cone>

      </a-entity>
      
    </a-marker>

    <!-- Cámara para detección e interacción táctil -->
    <a-entity camera>
      <a-cursor raycaster="objects: [cursor-listener]" fuse="false"></a-cursor>
    </a-entity>

  </a-scene>

  <!-- Script para la interacción (salto y giro al tocarlo en pantalla) -->
  <script>
    AFRAME.registerComponent('cursor-listener', {
      init: function () {
        var el = this.el;
        var animando = false;

        el.addEventListener('click', function () {
          if (animando) return;
          animando = true;

          el.setAttribute('animation__jump', {
            property: 'position',
            to: '0 1.2 0',
            dir: 'alternate',
            dur: 500,
            loop: 2,
            easing: 'easeOutQuad'
          });

          el.setAttribute('animation__spin', {
            property: 'rotation',
            to: '0 360 0',
            dur: 1000,
            easing: 'easeInOutQuad'
          });

          setTimeout(function () {
            el.removeAttribute('animation__jump');
            el.removeAttribute('animation__spin');
            el.setAttribute('rotation', '0 0 0');
            el.setAttribute('position', '0 0 0');
            animando = false;
          }, 1100);
        });
      }
    });
  </script>

</body>
</html>
