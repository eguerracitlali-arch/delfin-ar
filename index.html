<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiencia WebAR - Robot Pastel</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene embedded 
           arjs="sourceType: webcam; debugUIEnabled: false;" 
           vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true;">

    <!-- Iluminación clara y suave -->
    <a-light type="ambient" color="#ffffff" intensity="0.95"></a-light>
    <a-light type="directional" color="#fce7f3" intensity="0.5" position="-1 4 2"></a-light>

    <!-- Marcador Hiro -->
    <a-marker preset="hiro" id="marker-hiro">

      <!-- PISO / REFERENCIA VISUAL (Base gris muy claro con aro rosa pastel suave) -->
      <a-cylinder position="0 0 0" radius="1.1" height="0.02" color="#f1f5f9"></a-cylinder>
      <a-ring position="0 0.02 0" radius-inner="0.85" radius-outer="1.0" color="#fbcfe8" rotation="-90 0 0"></a-ring>

      <!-- ROBOT DE PIE (Tonos pasteles claros: Lila suave, Rosa claro, Blanco) -->
      <a-entity id="robot" 
                position="0 0.1 0" 
                scale="0.45 0.45 0.45" 
                rotation="-90 0 0" 
                interaccion-robot>

        <!-- Cabeza (Lila pastel muy claro) -->
        <a-box id="cabeza" position="0 1.2 0" width="0.6" height="0.5" depth="0.5" color="#e9d5ff"></a-box>

        <!-- Ojos (Blanco con destello muy suave) -->
        <a-sphere position="-0.15 1.28 0.26" radius="0.08" color="#ffffff"></a-sphere>
        <a-sphere position="0.15 1.28 0.26" radius="0.08" color="#ffffff"></a-sphere>

        <!-- Antena con esfera rosa pastel -->
        <a-cylinder position="0 1.55 0" radius="0.02" height="0.2" color="#f5d0fe"></a-cylinder>
        <a-sphere position="0 1.68 0" radius="0.07" color="#fbcfe8"></a-sphere>

        <!-- Cuello (Lila muy claro) -->
        <a-cylinder position="0 0.9 0" radius="0.1" height="0.1" color="#f3e8ff"></a-cylinder>

        <!-- Cuerpo / Torso (Rosa pastel muy suave) -->
        <a-box id="cuerpo" position="0 0.45 0" width="0.8" height="0.8" depth="0.6" color="#fce7f3"></a-box>
        
        <!-- Panel del pecho en tono suave -->
        <a-plane position="0 0.45 0.31" width="0.4" height="0.4" color="#f5d0fe"></a-plane>
        <a-circle position="0 0.45 0.32" radius="0.1" color="#ffffff"></a-circle>

        <!-- Brazos (Lila pastel suave) -->
        <a-cylinder position="-0.52 0.5 0" radius="0.08" height="0.6" color="#e9d5ff" rotation="0 0 15"></a-cylinder>
        <a-cylinder position="0.52 0.5 0" radius="0.08" height="0.6" color="#e9d5ff" rotation="0 0 -15"></a-cylinder>

        <!-- Piernas (Lila suave) -->
        <a-cylinder position="-0.2 -0.1 0" radius="0.1" height="0.4" color="#ddd6fe"></a-cylinder>
        <a-cylinder position="0.2 -0.1 0" radius="0.1" height="0.4" color="#ddd6fe"></a-cylinder>

      </a-entity>

    </a-marker>

    <!-- Cámara -->
    <a-entity camera>
      <a-cursor raycaster="objects: [interaccion-robot]" fuse="false"></a-cursor>
    </a-entity>

  </a-scene>

  <!-- Script para la interacción táctil JS (+ RA) con colores pasteles claros -->
  <script>
    AFRAME.registerComponent('interaccion-robot', {
      init: function () {
        var el = this.el;
        var cabeza = document.querySelector('#cabeza');
        var cuerpo = document.querySelector('#cuerpo');
        var animando = false;

        // Paleta de tonos pasteles súper claros para los cambios al tocar
        var colores = ['#fce7f3', '#e9d5ff', '#f5d0fe', '#ddd6fe', '#fae8ff', '#fbcfe8'];
        var indiceColor = 0;

        el.addEventListener('click', function () {
          if (animando) return;
          animando = true;

          // 1. Cambio de Color pastel suave
          indiceColor = (indiceColor + 1) % colores.length;
          var nuevoColor = colores[indiceColor];
          cabeza.setAttribute('material', 'color', nuevoColor);
          cuerpo.setAttribute('material', 'color', nuevoColor);

          // 2. Aumento de tamaño temporal
          el.setAttribute('animation__scale', {
            property: 'scale',
            to: '0.6 0.6 0.6',
            dir: 'alternate',
            dur: 300,
            loop: 2,
            easing: 'easeOutQuad'
          });

          // 3. Giro completo
          el.setAttribute('animation__spin', {
            property: 'rotation',
            to: '-90 360 0',
            dur: 800,
            easing: 'easeInOutQuad'
          });

          setTimeout(function () {
            el.removeAttribute('animation__scale');
            el.removeAttribute('animation__spin');
            el.setAttribute('scale', '0.45 0.45 0.45');
            el.setAttribute('rotation', '-90 0 0');
            animando = false;
          }, 900);
        });
      }
    });
  </script>

</body>
</html>
